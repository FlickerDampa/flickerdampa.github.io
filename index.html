<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FlickerDampa</title>
<meta name="description" content="Security researcher and enthusiast in programming and solutions.">
<style>
:root { --bg: #f6f7f9; --fg: #14181f; --muted: #5a6472; --accent: #0a7f5a; }
@media (prefers-color-scheme: dark) {
  :root { --bg: #0d1117; --fg: #e6edf3; --muted: #9aa5b1; --accent: #3fd6a0; }
}
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
  background: var(--bg); color: var(--fg); font-family: ui-monospace, "Cascadia Code", Consolas, monospace; }
main { max-width: 620px; width: 100%; }
p.tag { color: var(--accent); margin: 0 0 12px; }
h1 { font-size: clamp(2.2rem, 8vw, 3.4rem); margin: 0 0 16px; overflow-wrap: anywhere; }
p.lead { color: var(--muted); font-size: 1.1rem; line-height: 1.6; margin: 0 0 28px; }
a { color: var(--accent); }
</style>
</head>
<body>
<main>
<p class="tag">$ whoami</p>
<h1>FlickerDampa</h1>
<p class="lead">Security researcher and enthusiast in programming and solutions.</p>
<a href="https://github.com/FlickerDampa">github.com/FlickerDampa</a>
</main>
</body>
</html>
